apiVersion: apps/v1
kind: Deployment
metadata:
  name: absolute-cinema-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: absolute-cinema-frontend
  template:
    metadata:
      labels:
        app: absolute-cinema-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/placeholder/absolute-cinema-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: absolute-cinema-frontend
spec:
  type: ClusterIP
  selector:
    app: absolute-cinema-frontend
  ports:
    - port: 80
      targetPort: 80
