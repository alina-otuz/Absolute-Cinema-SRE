apiVersion: apps/v1
kind: Deployment
metadata:
  name: absolute-cinema-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: absolute-cinema-backend
  template:
    metadata:
      labels:
        app: absolute-cinema-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: ghcr.io/placeholder/absolute-cinema-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: production
            - name: MONGO_URI
              value: mongodb://mongo:27017/absolute_cinema
            - name: JWT_SECRET
              value: "your-secret-key-here"
---
apiVersion: v1
kind: Service
metadata:
  name: absolute-cinema-backend
spec:
  type: ClusterIP
  selector:
    app: absolute-cinema-backend
  ports:
    - port: 3001
      targetPort: 3001
