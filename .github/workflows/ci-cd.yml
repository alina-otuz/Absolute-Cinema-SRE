name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY_URL: ghcr.io
  IMAGE_NAMESPACE: alina-otuz

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest 
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAMESPACE }}/absolute-cinema-backend:${{ github.sha }}
            ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAMESPACE }}/absolute-cinema-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAMESPACE }}/absolute-cinema-frontend:${{ github.sha }}
            ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAMESPACE }}/absolute-cinema-frontend:latest

  deploy:
    name: Deploy to Kubernetes Cluster
    runs-on: self-hosted
    needs: build-and-push
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Apply Kubernetes manifests
        run: |
          $env:KUBECONFIG = "$HOME\.kube\config"
          
          kubectl apply -f k8s/
          
          # Обновляем образы в кластере на только что собранные
          kubectl set image deployment/absolute-cinema-backend backend=${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAMESPACE }}/absolute-cinema-backend:${{ github.sha }}
          kubectl set image deployment/absolute-cinema-frontend frontend=${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAMESPACE }}/absolute-cinema-frontend:${{ github.sha }}
          
          kubectl rollout status deployment/absolute-cinema-backend --timeout=120s
          kubectl rollout status deployment/absolute-cinema-frontend --timeout=120s

 
